    <style>
        body {
            font-family: 'Nunito', sans-serif;
            user-select: none;
            background-color: #f0fdf4;

        .heading-font {

        /* Glassmorphism & custom buttons */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 4px solid #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .btn-game {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 6px 0 shadow-color;
        }

        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 shadow-color;
        }

        /* Custom Animations */
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .animate-pulse-slow {
            animation: pulse-slow 2.5s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .symbol-card {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);

        .symbol-card:hover {
            transform: translateY(-8px) scale(1.02);

        /* Custom Drag & Drop styling */
        .drag-item {
            cursor: grab;
        }
        .drag-item:active {
            cursor: grabbing;
        }
        .drop-zone.over {
            border-color: #06D6A0 !important;
            background-color: #d1fae5 !important;
        }

        /* Print certificate styles */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white;
            }

<body class="bg-gradient-to-br from-amber-50 via-sky-50 to-emerald-50 min-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden">

    <script>
        // Global App State
        let currentSlide = 1;
        const totalSlides = 25;
        let isTTSActive = true;
        let studentName = "Detektif Cilik";
        
        // Game states
        let gameScore = 0;
        let tebakRonde = 0;
        let matchedCount = 0;
        let reflectionFeeling = "";
        let reflectionChecklist = [false, false, false, false];

        // Web Audio API Sound Generator for Offline FX
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSoundFX(type) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now); // A3
                    osc.frequency.setValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'star') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.setValueAtTime(1046.50, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                console.log('Audio FX Error', e);
            }
        }

        // Text-To-Speech Narrator for 1st Graders
        function speakText(text) {
            if (!isTTSActive || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Stop ongoing speech

            // Clean string of emojis for natural TTS
            const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'id-ID';
            utterance.rate = 0.9; // Slightly slower for primary kids
            utterance.pitch = 1.1;

            window.speechSynthesis.speak(utterance);
        }

        function toggleAudioNarrator() {
            isTTSActive = !isTTSActive;
            const btnIcon = document.getElementById('tts-icon');
            const btnText = document.querySelector('#btn-tts span');
            if (isTTSActive) {
                btnIcon.className = "fa-solid fa-volume-high text-lg";
                if(btnText) btnText.innerText = "Suara: ON";
                speakText("Suara narator aktif.");
            } else {
                window.speechSynthesis.cancel();
                btnIcon.className = "fa-solid fa-volume-xmark text-lg text-slate-400";
                if(btnText) btnText.innerText = "Suara: OFF";
            }
        }

        // Pancasila Data Definitions
        const simbolData = [
            { id: 1, name: "Bintang", sila: "Sila ke-1", svg: `<svg class="w-24 h-24 sm:w-28 sm:h-28 mx-auto drop-shadow-md animate-float" viewBox="0 0 100 100"><polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="#FFD166" stroke="#D4A373" stroke-width="3"/></svg>`, color: "bg-amber-100 border-amber-400 text-amber-900", desc: "Bintang adalah simbol sila pertama Pancasila." },
            { id: 2, name: "Rantai", sila: "Sila ke-2", svg: `<svg class="w-24 h-24 sm:w-28 sm:h-28 mx-auto drop-shadow-md animate-float" viewBox="0 0 100 100"><rect x="15" y="40" width="30" height="20" rx="10" fill="none" stroke="#E76F51" stroke-width="8"/><rect x="35" y="40" width="30" height="20" rx="10" fill="none" stroke="#E76F51" stroke-width="8"/><rect x="55" y="40" width="30" height="20" rx="10" fill="none" stroke="#E76F51" stroke-width="8"/></svg>`, color: "bg-rose-100 border-rose-400 text-rose-900", desc: "Rantai adalah simbol sila kedua Pancasila." },
            { id: 3, name: "Pohon Beringin", sila: "Sila ke-3", svg: `<svg class="w-24 h-24 sm:w-28 sm:h-28 mx-auto drop-shadow-md animate-float" viewBox="0 0 100 100"><path d="M42,90 L58,90 L58,60 L42,60 Z" fill="#8D6E63"/><circle cx="50" cy="42" r="30" fill="#2A9D8F"/><circle cx="32" cy="50" r="18" fill="#2A9D8F"/><circle cx="68" cy="50" r="18" fill="#2A9D8F"/></svg>`, color: "bg-emerald-100 border-emerald-400 text-emerald-900", desc: "Pohon Beringin adalah simbol sila ketiga Pancasila." },
            { id: 4, name: "Kepala Banteng", sila: "Sila ke-4", svg: `<svg class="w-24 h-24 sm:w-28 sm:h-28 mx-auto drop-shadow-md animate-float" viewBox="0 0 100 100"><path d="M25,25 Q10,10 25,40 Q40,60 50,75 Q60,60 75,40 Q90,10 75,25 Q50,30 25,25 Z" fill="#264653"/><ellipse cx="50" cy="55" rx="20" ry="22" fill="#264653"/><circle cx="40" cy="50" r="4" fill="#FFFFFF"/><circle cx="60" cy="50" r="4" fill="#FFFFFF"/></svg>`, color: "bg-slate-200 border-slate-500 text-slate-900", desc: "Kepala Banteng adalah simbol sila keempat Pancasila." },

        // Detailed Slide Rendering Logic

            "4. Mengenal Garuda Pancasila",

            "20. Checklist Pemahaman",
            "21. Pesan Makna NKRI",
            "22. Tepuk Pancasila",
            "23. Lagu Garuda Pancasila",
            "24. Penghargaan Bintang",
            "25. Penutup"
        ];

        function renderSlideContent(slideNum) {
            const container = document.getElementById('slide-content');
            let html = "";
            let speechText = "";

            switch(slideNum) {
                case 1: // SLIDE 1 - COVER
                    speechText = "Selamat datang di Petualangan Detektif Cilik Lambang Negara! Mari kita mengenal lima simbol Pancasila bersama!";
                    html = `
                        <div class="text-center py-4 space-y-4">
                            <div class="inline-block bg-amber-100 text-amber-800 border-2 border-amber-300 px-4 py-1.5 rounded-full font-bold text-xs sm:text-sm shadow-sm">
                                🕵️‍♂️ ELEMEN NKRI • KELAS 1 SD FASE A
                            </div>
                            <h2 class="heading-font text-3xl sm:text-5xl font-black text-amber-600 tracking-wide leading-tight">
                                PETUALANGAN DETEKTIF CILIK<br>
                                <span class="text-slate-800">LAMBANG NEGARA</span>
                            </h2>
                            <p class="text-slate-600 font-bold text-lg sm:text-xl">
                                ✨ Mengenal 5 Simbol Pancasila ✨

                            <!-- Big Garuda Illustration -->
                            <div class="relative w-40 h-40 sm:w-48 sm:h-48 mx-auto my-4 bg-gradient-to-t from-amber-200 to-amber-50 rounded-full flex items-center justify-center p-3 border-4 border-amber-400 shadow-inner">
                                <div class="text-7xl sm:text-8xl animate-pulse-slow">🦅</div>

                                <div class="absolute -top-2 -left-2 text-3xl">⭐</div>
                            </div>

                            <div class="pt-2">
                                <button onclick="playSoundFX('click'); nextSlide();" class="btn-game bg-amber-500 hover:bg-amber-600 text-white font-black text-xl sm:text-2xl px-8 py-4 rounded-3xl border-b-8 border-amber-700 shadow-xl inline-flex items-center gap-3 transform hover:scale-105 transition">

                case 2: // SLIDE 2 - WELCOME & MISSIONS

                    html = `
                        <div class="space-y-6">

                                <div class="text-5xl">🕵️‍♀️</div>

                                        Hari ini kita akan mencari dan mengenal <strong>5 simbol hebat</strong> dalam perisai Garuda Pancasila!

                                </div>
                                <div class="bg-emerald-50 border-2 border-emerald-300 p-3 rounded-2xl flex items-center gap-3">
                                    <span class="text-2xl">🧩</span>
                                    <span class="font-bold text-emerald-900 text-sm">Misi 2: Mencocokkan Simbol</span>
                                </div>
                                <div class="bg-purple-50 border-2 border-purple-300 p-3 rounded-2xl flex items-center gap-3">
                                    <span class="text-2xl">🛡️</span>

                                </button>
                            </div>

                    `;
                    break;

                case 3: // SLIDE 3 - APERSEPSI QUIZ
                    speechText = "Anak-anak, coba lihat gambar burung gagah ini. Ada yang tahu gambar apa itu?";
                    html = `
                        <div class="text-center space-y-4">
                            <h3 class="heading-font text-2xl font-bold text-slate-800">
                                ❓ PERTANYAAN DETEKTIF
                            </h3>
                            <p class="text-slate-600 font-semibold text-lg">
                                "Anak-anak, coba lihat gambar burung gagah ini. Ada yang tahu gambar apa itu?"
                            </p>

                            <div class="w-32 h-32 mx-auto bg-amber-100 rounded-2xl border-4 border-amber-300 flex items-center justify-center text-6xl shadow-md my-2">

                            </div>

                            <div id="apersepsi-options" class="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-xl mx-auto">
                                <button onclick="checkApersepsi(false, this)" class="btn-game bg-white hover:bg-slate-50 border-4 border-slate-200 text-slate-800 font-bold p-3 rounded-2xl text-base shadow">
                                    A. Burung Biasa
                                </button>
                                <button onclick="checkApersepsi(true, this)" class="btn-game bg-white hover:bg-slate-50 border-4 border-slate-200 text-slate-800 font-bold p-3 rounded-2xl text-base shadow">
                                    B. Garuda Pancasila
                                </button>
                                <button onclick="checkApersepsi(false, this)" class="btn-game bg-white hover:bg-slate-50 border-4 border-slate-200 text-slate-800 font-bold p-3 rounded-2xl text-base shadow">
                                    C. Burung Mainan
                                </button>
                            </div>

                            <div id="apersepsi-feedback" class="min-h-[50px] font-bold text-lg"></div>
                        </div>
                    `;
                    break;

                case 4: // SLIDE 4 - GARUDA PANCASILA OVERVIEW
                    speechText = "Garuda Pancasila adalah Lambang Negara Indonesia. Di dada Garuda terdapat perisai yang memiliki 5 simbol Pancasila.";
                    html = `
                        <div class="text-center space-y-5">
                            <h3 class="heading-font text-2xl sm:text-3xl font-bold text-amber-700">
                                MENGENAL GARUDA PANCASILA
                            </h3>

                        renderSlideContent(11);
                    }
                }, 1200);
            } else {
                playSoundFX('wrong');
                fb.className = "min-h-[40px] font-extrabold text-rose-500 text-base";
                fb.innerText = "Belum tepat. Coba perhatikan bentuk simbolnya lagi. 😊";
            }
        }

        // Game 2: Pasangkan Simbol & Sila
        let selectedSimbolId = null;

        function renderMatchingGame() {
            return `
                <div class="text-center space-y-4">
                    <h3 class="heading-font text-2xl font-bold text-purple-800">
                        🧩 PASANGKAN SIMBOL DENGAN SILANYA
                    </h3>
                    <p class="text-slate-600 text-xs sm:text-sm font-bold">Klik Simbol terlebih dahulu, lalu klik Sila yang sesuai!</p>

                    <div class="grid grid-cols-2 gap-4 max-w-lg mx-auto">
                        <!-- Column 1: Simbols -->
                        <div class="space-y-2">
                            <h4 class="font-black text-slate-700 text-xs">SIMBOL</h4>
                            ${simbolData.map(s => `
                                <button id="match-sim-${s.id}" onclick="selectSimbolForMatch(${s.id})" class="w-full bg-white border-3 border-purple-200 hover:border-purple-400 p-2 rounded-2xl flex items-center gap-2 transition font-bold text-xs shadow-sm">
                                    <div class="w-8 h-8">${s.svg}</div>
                                    <span>${s.name}</span>
                                </button>
                            `).join('')}
                        </div>

                        <!-- Column 2: Silas -->
                        <div class="space-y-2">
                            <h4 class="font-black text-slate-700 text-xs">SILA</h4>
                            ${[1, 2, 3, 4, 5].map(sNum => `
                                <button id="match-sila-${sNum}" onclick="selectSilaForMatch(${sNum})" class="w-full bg-purple-50 hover:bg-purple-100 border-3 border-purple-300 p-3 rounded-2xl font-black text-purple-900 text-xs sm:text-sm shadow-sm flex items-center justify-between">
                                    <span>Sila ke-${sNum}</span>
                                    <span class="text-purple-400">➡️</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div id="match-feedback" class="min-h-[35px] font-extrabold text-sm text-purple-700"></div>
                </div>
            `;
        }

        function selectSimbolForMatch(id) {
            playSoundFX('click');
            selectedSimbolId = id;
            simbolData.forEach(s => {
                const btn = document.getElementById(`match-sim-${s.id}`);
                if(btn) btn.className = s.id === id ? "w-full bg-purple-200 border-4 border-purple-600 p-2 rounded-2xl flex items-center gap-2 font-black text-xs" : "w-full bg-white border-3 border-purple-200 p-2 rounded-2xl flex items-center gap-2 font-bold text-xs";
            });
            document.getElementById('match-feedback').innerText = "Sekarang pilih Sila yang cocok!";
        }

        function selectSilaForMatch(silaNum) {
            if (!selectedSimbolId) {
                document.getElementById('match-feedback').innerText = "Klik pilihan Simbol dulu ya!";
                return;
            }
            if (selectedSimbolId === silaNum) {
                playSoundFX('correct');
                matchedCount++;
                document.getElementById(`match-sim-${selectedSimbolId}`).style.opacity = '0.4';
                document.getElementById(`match-sila-${silaNum}`).className = "w-full bg-emerald-100 border-3 border-emerald-500 p-3 rounded-2xl font-black text-emerald-900 text-xs";
                document.getElementById('match-feedback').innerText = "⭐ Pasangan Tepat! Hebat!";
                selectedSimbolId = null;
                if(matchedCount >= 5) {
                    triggerConfetti();
                    setTimeout(() => goToSlide(13), 1500);
                }
            } else {
                playSoundFX('wrong');
                document.getElementById('match-feedback').innerText = "Belum cocok, coba lagi! 😊";
            }
        }

        // Game 3: Puzzle Perisai
        let shieldSlots = [null, null, null, null, null];

        function renderShieldPuzzleGame() {
            return `
                <div class="text-center space-y-3">
                    <h3 class="heading-font text-2xl font-bold text-amber-800">
                        🛡️ DETEKTIF PERISAI PANCASILA
                    </h3>
                    <p class="text-slate-600 font-bold text-xs">Klik Simbol di bawah lalu klik nomor posisi di perisai!</p>

                    <!-- Blank Shield slots grid -->
                    <div class="relative w-64 h-64 mx-auto bg-amber-100 border-4 border-amber-400 rounded-3xl p-3 grid grid-cols-2 gap-2 shadow-inner">
                        <div onclick="placeInShield(0)" class="border-2 border-dashed border-amber-400 rounded-xl flex items-center justify-center bg-white/70 cursor-pointer">
                            ${shieldSlots[0] ? shieldSlots[0].svg : '<span class="font-black text-amber-700 text-xs">1. Bintang</span>'}
                        </div>
                        <div onclick="placeInShield(1)" class="border-2 border-dashed border-amber-400 rounded-xl flex items-center justify-center bg-white/70 cursor-pointer">
                            ${shieldSlots[1] ? shieldSlots[1].svg : '<span class="font-black text-amber-700 text-xs">2. Rantai</span>'}
                        </div>
                        <div onclick="placeInShield(2)" class="border-2 border-dashed border-amber-400 rounded-xl flex items-center justify-center bg-white/70 cursor-pointer">
                            ${shieldSlots[2] ? shieldSlots[2].svg : '<span class="font-black text-amber-700 text-xs">3. Beringin</span>'}
                        </div>
                        <div onclick="placeInShield(3)" class="border-2 border-dashed border-amber-400 rounded-xl flex items-center justify-center bg-white/70 cursor-pointer">
                            ${shieldSlots[3] ? shieldSlots[3].svg : '<span class="font-black text-amber-700 text-xs">4. Banteng</span>'}
                        </div>
                        <div onclick="placeInShield(4)" class="col-span-2 border-2 border-dashed border-amber-400 rounded-xl flex items-center justify-center bg-white/70 cursor-pointer">
                            ${shieldSlots[4] ? shieldSlots[4].svg : '<span class="font-black text-amber-700 text-xs">5. Padi & Kapas</span>'}
                        </div>
                    </div>

                    <!-- Available Symbol options -->
                    <div class="flex justify-center gap-2 overflow-x-auto p-1">
                        ${simbolData.map(s => `
                            <button onclick="selectedForShield=${s.id}; playSoundFX('click');" class="bg-white border-2 border-amber-300 p-1.5 rounded-xl w-14 h-14 flex items-center justify-center hover:scale-110 transition shadow-sm">
                                ${s.svg}
                            </button>
                        `).join('')}
                    </div>

                    <div id="shield-feedback" class="min-h-[25px] font-bold text-xs text-amber-900"></div>
                </div>
            `;
        }

        let selectedForShield = null;
        function placeInShield(slotIdx) {
            if (!selectedForShield) {
                document.getElementById('shield-feedback').innerText = "Pilih dulu simbol di bawah!";
                return;
            }
            if (selectedForShield === slotIdx + 1) {
                playSoundFX('correct');
                shieldSlots[slotIdx] = simbolData[slotIdx];
                selectedForShield = null;
                renderSlideContent(13);
                if (shieldSlots.every(s => s !== null)) {
                    triggerConfetti();
                    document.getElementById('shield-feedback').innerText = "🎉 PERISAI LENGKAP! KAMU DETEKTIF HEBAT!";
                }
            } else {
                playSoundFX('wrong');
                document.getElementById('shield-feedback').innerText = "Posisi kurang tepat untuk simbol ini!";
            }
        }

        // Game 4: Benar atau Salah
        const trueFalseQuestions = [
            { text: "Bintang adalah simbol sila pertama.", ans: true },
            { text: "Rantai adalah simbol sila kedua.", ans: true },
            { text: "Pohon beringin adalah simbol sila kelima.", ans: false },
            { text: "Kepala banteng adalah simbol sila keempat.", ans: true },
            { text: "Padi dan kapas adalah simbol sila ketiga.", ans: false }
        ];
        let tfIndex = 0;

        function renderTrueFalseGame() {
            const q = trueFalseQuestions[tfIndex % trueFalseQuestions.length];
            return `
                <div class="text-center space-y-4">
                    <span class="font-black text-amber-700 text-xs">Soal ${tfIndex + 1} / 5</span>
                    <h3 class="heading-font text-2xl font-bold text-slate-800">
                        ✅ GAME BENAR ATAU SALAH ❌
                    </h3>

                    <div class="bg-amber-50 border-4 border-amber-300 p-6 rounded-3xl max-w-md mx-auto shadow-sm">
                        <p class="font-black text-slate-800 text-lg">
                            "${q.text}"
                        </p>
                    </div>

                    <div class="flex justify-center gap-4 max-w-xs mx-auto">
                        <button onclick="checkTrueFalse(true, ${q.ans})" class="btn-game bg-emerald-500 hover:bg-emerald-600 text-white font-black px-6 py-3 rounded-2xl border-b-4 border-emerald-700 text-base flex-1">
                            ✅ BENAR
                        </button>
                        <button onclick="checkTrueFalse(false, ${q.ans})" class="btn-game bg-rose-500 hover:bg-rose-600 text-white font-black px-6 py-3 rounded-2xl border-b-4 border-rose-700 text-base flex-1">
                            ❌ SALAH
                        </button>
                    </div>

                    <div id="tf-feedback" class="min-h-[35px] font-black text-base"></div>
                </div>
            `;
        }

        function checkTrueFalse(userChoice, correctChoice) {
            const fb = document.getElementById('tf-feedback');
            if (userChoice === correctChoice) {
                playSoundFX('correct');
                fb.className = "min-h-[35px] font-black text-emerald-600 text-lg";
                fb.innerText = "⭐ JAWABAN BENAR!";
                setTimeout(() => {
                    tfIndex++;
                    if(tfIndex >= 5) goToSlide(17);
                    else renderSlideContent(16);
                }, 1000);
            } else {
                playSoundFX('wrong');
                fb.className = "min-h-[35px] font-black text-rose-500 text-base";
                fb.innerText = "Coba pikirkan lagi ya! 😊";
            }
        }

        // Quiz Mandiri
        let mandiriIdx = 0;
        const mandiriQuestions = [
            { q: "Simbol sila pertama adalah...", opts: ["Bintang", "Rantai", "Padi Kapas"], ans: 0 },
            { q: "Simbol sila ketiga adalah...", opts: ["Banteng", "Pohon Beringin", "Bintang"], ans: 1 },
            { q: "Padi dan Kapas melambangkan sila ke-...", opts: ["3", "4", "5"], ans: 2 },
            { q: "Rantai adalah simbol sila ke-...", opts: ["2", "1", "5"], ans: 0 },
            { q: "Sila keempat disimbolkan oleh...", opts: ["Beringin", "Kepala Banteng", "Bintang"], ans: 1 }
        ];

        function renderQuizMandiri() {
            const q = mandiriQuestions[mandiriIdx % mandiriQuestions.length];
            return `
                <div class="text-center space-y-4">
                    <span class="font-black text-sky-700 text-xs">Soal ${mandiriIdx + 1} / 5</span>
                    <h3 class="heading-font text-2xl font-bold text-sky-800">
                        ⭐ UJI KEMAMPUAN DETEKTIF
                    </h3>

                    <div class="bg-sky-50 border-3 border-sky-300 p-4 rounded-3xl max-w-md mx-auto">
                        <p class="font-black text-slate-800 text-base sm:text-lg">"${q.q}"</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-md mx-auto">
                        ${q.opts.map((opt, i) => `
                            <button onclick="checkMandiriQuiz(${i}, ${q.ans})" class="btn-game bg-white border-3 border-sky-200 text-slate-800 font-extrabold p-3 rounded-2xl text-sm shadow-sm">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>

                    <div id="mandiri-feedback" class="min-h-[35px] font-black text-sm text-sky-700"></div>
                </div>
            `;
        }

        function checkMandiriQuiz(selected, correct) {
            const fb = document.getElementById('mandiri-feedback');
            if (selected === correct) {
                playSoundFX('correct');
                fb.innerText = "⭐ Tepat Sekali!";
                setTimeout(() => {
                    mandiriIdx++;
                    if (mandiriIdx >= 5) goToSlide(18);
                    else renderSlideContent(17);
                }, 1000);
            } else {
                playSoundFX('wrong');
                fb.innerText = "Hampir tepat! Coba lagi.";
            }
        }

        // Kuis Akhir RPP (3 Soal)
        let rppKuisIdx = 0;
        const rppQuestions = [
            { q: "Manakah simbol sila ke-1?", opts: ["⭐ Bintang", "⛓️ Rantai", "🌾 Padi Kapas"], ans: 0 },
            { q: "Manakah simbol sila ke-3?", opts: ["🐂 Banteng", "🌳 Pohon Beringin", "⭐ Bintang"], ans: 1 },
            { q: "Manakah simbol sila ke-5?", opts: ["⛓️ Rantai", "🌾 Padi dan Kapas", "🌳 Pohon Beringin"], ans: 1 }
        ];

        function renderKuisAkhirRPP() {
            const q = rppQuestions[rppKuisIdx % rppQuestions.length];
            return `
                <div class="text-center space-y-4">
                    <span class="font-black text-amber-700 text-xs">Kuis Penutup ${rppKuisIdx + 1} / 3</span>
                    <h3 class="heading-font text-2xl font-bold text-amber-800">
                        🎯 KUIS AKHIR PANCASILA
                    </h3>

                    <div class="bg-amber-50 border-4 border-amber-300 p-5 rounded-3xl max-w-md mx-auto">
                        <p class="font-black text-slate-800 text-lg">"${q.q}"</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 max-w-md mx-auto">
                        ${q.opts.map((opt, i) => `
                            <button onclick="checkKuisAkhir(${i}, ${q.ans})" class="btn-game bg-white border-3 border-amber-300 text-slate-800 font-extrabold p-3 rounded-2xl text-sm shadow">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>

                    <div id="kuis-akhir-fb" class="min-h-[35px] font-black text-base"></div>
                </div>
            `;
        }

        function checkKuisAkhir(selected, correct) {
            const fb = document.getElementById('kuis-akhir-fb');
            if (selected === correct) {
                playSoundFX('correct');
                fb.className = "min-h-[35px] font-black text-emerald-600 text-lg";
                fb.innerText = "⭐ HEBAT! Kamu Menyelesaikan Misi!";
                setTimeout(() => {
                    rppKuisIdx++;
                    if (rppKuisIdx >= 3) goToSlide(19);
                    else renderSlideContent(18);
                }, 1000);
            } else {
                playSoundFX('wrong');
                fb.className = "min-h-[35px] font-black text-rose-500 text-base";
                fb.innerText = "Coba perhatikan gambarnya lagi ya!";
            }
        }

        function checkApersepsi(isCorrect, btn) {
            const fb = document.getElementById('apersepsi-feedback');
            if (isCorrect) {
                playSoundFX('correct');
                fb.className = "min-h-[50px] font-bold text-emerald-600 text-lg animate-bounce";
                fb.innerText = "Hebat! Kamu mengenal Garuda Pancasila! ⭐";
            } else {
                playSoundFX('wrong');
                fb.className = "min-h-[50px] font-bold text-amber-700 text-base";
                fb.innerText = "Ayo perhatikan lagi gambar Garuda dengan teliti. 😊";
            }
        }

        function chooseReflection(type) {
            playSoundFX('click');
            reflectionFeeling = type;
            const fb = document.getElementById('reflection-feedback');
            fb.classList.remove('hidden');

            if (type === 'SENANG') {
                fb.innerText = "Keren! Kamu belajar dengan gembira. ⭐";
            } else if (type === 'CUKUP') {
                fb.innerText = "Terima kasih sudah belajar. Terus berlatih ya!";
            } else {
                fb.innerText = "Tidak apa-apa. Kita bisa belajar bersama lagi.";
            }
        }

        function toggleChecklist(idx) {
            playSoundFX('click');
            reflectionChecklist[idx] = !reflectionChecklist[idx];
        }

        function openGroupModal() {
            playSoundFX('click');
            document.getElementById('group-modal').classList.remove('hidden');
        }

        function closeGroupModal() {
            playSoundFX('click');
            document.getElementById('group-modal').classList.add('hidden');
        }

        function triggerConfetti() {
            try {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            } catch(e) {}
        }

        function updateNavigationUI() {
            document.getElementById('slide-indicator').innerText = `${currentSlide} / ${totalSlides}`;
            document.getElementById('btn-prev').disabled = currentSlide === 1;

            const select = document.getElementById('slide-select');
            select.value = currentSlide;
        }

        function goToSlide(n) {
            if (n < 1 || n > totalSlides) return;
            currentSlide = n;
            renderSlideContent(currentSlide);
        }

        function nextSlide() {
            playSoundFX('click');
            if (currentSlide < totalSlides) {
                goToSlide(currentSlide + 1);
            }
        }

        function prevSlide() {
            playSoundFX('click');
            if (currentSlide > 1) {
                goToSlide(currentSlide - 1);
            }
        }

        function repeatCurrentSlideSpeech() {
            playSoundFX('click');
            renderSlideContent(currentSlide);
        }

        // Initialize App on Window Load
        window.onload = function() {
            const select = document.getElementById('slide-select');
            slideTitles.forEach((title, idx) => {
                const opt = document.createElement('option');
                opt.value = idx + 1;
                opt.innerText = title;
                select.appendChild(opt);
            });

            renderSlideContent(1);
        };
    </script>
</body>
</html>
